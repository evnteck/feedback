<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Evnteck | لوحة التقييمات</title>
<meta name="theme-color" content="#450F67">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600&display=swap" rel="stylesheet">
<style>
  :root{
    --dark-purple:#2C1B47; --royal-purple:#450F67; --lavender:#935FC7; --ink:#1E1740;
    --pink:#DF145B; --pink-l:#F1637A; --green:#1F9D6B;
    --bg:#F7F4FB; --card:#FFFFFF; --line:#E8E0F2; --muted:#6E6487; --soft:#F3ECFA;
    --f-ar:'IBM Plex Sans Arabic',system-ui,sans-serif;
    --f-en:'Clash Display','IBM Plex Sans Arabic',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);overflow-x:hidden}
  body{font-family:var(--f-ar);line-height:1.6;min-height:100dvh}
  .en{font-family:var(--f-en)}
  button,a,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  .wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .hide{display:none!important}

  /* ===== تسجيل الدخول ===== */
  .login{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;
    background:linear-gradient(140deg,var(--royal-purple),var(--dark-purple) 60%,#5A1C82);background-size:220% 220%;
    animation:bgMove 16s ease-in-out infinite alternate}
  @keyframes bgMove{from{background-position:0% 30%}to{background-position:100% 70%}}
  .login form{width:100%;max-width:380px;background:#fff;border-radius:22px;padding:30px 24px;text-align:center;
    box-shadow:0 30px 70px rgba(0,0,0,.3);animation:up .5s cubic-bezier(.2,.8,.2,1)}
  .login img{height:44px;margin-bottom:18px}
  .login h1{font-size:20px;color:var(--royal-purple);margin-bottom:4px}
  .login p{color:var(--muted);font-size:14px;margin-bottom:20px}
  .login input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);
    font:inherit;font-size:16px;outline:none;text-align:center;transition:.2s}
  .login input:focus{border-color:var(--lavender);background:#fff;box-shadow:0 0 0 4px rgba(147,95,199,.15)}
  .login .err{color:var(--pink);font-size:14px;min-height:22px;margin:10px 0 4px;font-weight:500}
  @keyframes up{from{opacity:0;transform:translateY(16px)}}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);
    background:#fff;color:var(--royal-purple);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none}
  .btn:hover{border-color:var(--lavender);background:var(--soft)}
  .btn:active{transform:scale(.95)}
  .btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .btn.primary{background:linear-gradient(120deg,var(--royal-purple),var(--dark-purple));color:#fff;border:0;box-shadow:0 8px 20px rgba(69,15,103,.25)}
  .btn.primary:hover{filter:brightness(1.12)}
  .btn.block{width:100%;padding:14px;font-size:16px}
  .btn:disabled{opacity:.6;cursor:wait}
  .spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== الرأس ===== */
  header.top{background:linear-gradient(140deg,var(--royal-purple),var(--dark-purple));color:#fff;padding:16px 0 70px;
    padding-top:max(16px,env(safe-area-inset-top))}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .bar img{height:36px}
  .bar h1{font-size:18px;font-weight:600;flex:1;min-width:140px}
  .bar h1 small{display:block;font-size:12px;font-weight:400;color:rgba(255,255,255,.7)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .actions .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
  .actions .btn:hover{background:rgba(255,255,255,.2)}
  .actions .btn.light{background:#fff;color:var(--royal-purple);border-color:#fff}
  .demo{margin-top:12px;background:rgba(241,99,122,.18);border:1px solid rgba(241,99,122,.5);border-radius:10px;padding:8px 12px;font-size:13px}

  main{margin-top:-52px;padding-bottom:max(40px,env(safe-area-inset-bottom))}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}

  /* ===== الفلاتر ===== */
  .filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;box-shadow:0 10px 30px rgba(69,15,103,.08)}
  .filters label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .filters input,.filters select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
    font:inherit;font-size:15px;color:var(--ink);outline:none}
  .filters input:focus,.filters select:focus{border-color:var(--lavender);background:#fff}
  .custom{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:820px){.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}}
  @media(max-width:560px){.filters input,.filters select{font-size:16px}}

  /* ===== المؤشرات ===== */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.kpis{grid-template-columns:1fr 1fr}.kpis .kpi:first-child{grid-column:1/-1}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;animation:up .5s both}
  .kpi span{display:block;font-size:13px;color:var(--muted)}
  .kpi b{display:block;font-family:var(--f-en);font-size:30px;font-weight:500;color:var(--royal-purple);line-height:1.3;
    direction:ltr;unicode-bidi:isolate;text-align:right}
  .kpi small{font-size:12px;color:var(--muted)}
  .kpi.warn b{color:var(--pink)}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.two{grid-template-columns:1fr}}
  .panel h2{font-size:15px;color:var(--royal-purple);margin-bottom:12px}
  .meter{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font-size:13px;margin-bottom:8px}
  .meter .tr{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}
  .meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--lavender),var(--royal-purple));
    transform-origin:right;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
  html[dir=rtl] .meter i{background:linear-gradient(270deg,var(--lavender),var(--royal-purple))}
  .meter.low i{background:var(--pink-l)}
  .meter em{font-style:normal;font-family:var(--f-en);color:var(--muted);text-align:end}
  @keyframes grow{from{transform:scaleX(0)}}

  /* ===== الردود ===== */
  .list-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
  .list-h h2{font-size:17px;color:var(--royal-purple)}
  .list-h span{font-size:13px;color:var(--muted)}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
  .resp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:9px;
    animation:up .45s both;border-inline-start:4px solid var(--lavender)}
  .resp.low{border-inline-start-color:var(--pink)}
  .resp.top{border-inline-start-color:var(--green)}
  .r-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stars{display:flex;gap:2px}
  .stars svg{width:17px;height:17px;fill:#DDD0EE}
  .stars svg.on{fill:var(--lavender)}
  .resp.low .stars svg.on{fill:var(--pink)}
  .badge{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--royal-purple);font-weight:600;white-space:nowrap}
  .badge.p{background:#E3F6EE;color:var(--green)} .badge.d{background:#FDE7EE;color:var(--pink)}
  .badge.alert{background:var(--pink);color:#fff}
  .r-top time{margin-inline-start:auto;font-size:12px;color:var(--muted);font-family:var(--f-en);direction:ltr}
  .who b{font-size:16px}
  .who span{color:var(--muted);font-size:14px}
  .contact{display:flex;gap:6px;flex-wrap:wrap}
  .contact a{font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--royal-purple);text-decoration:none;font-weight:500}
  .contact a.wa{border-color:#BFE8D5;color:var(--green);background:#F2FBF7}
  .contact .ph{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tags span{font-size:12px;padding:3px 9px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .crit{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .crit b{color:var(--ink);font-family:var(--f-en)}
  .q{font-size:14px;background:var(--bg);border-radius:10px;padding:8px 11px;white-space:pre-wrap;word-break:break-word}
  .q b{display:block;font-size:12px;color:var(--muted);font-weight:500}
  .q.bad{background:#FFF4F6}
  .ref{background:linear-gradient(135deg,#FCFAFF,#F3ECFA);border:1px dashed #CDB6EA;border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
  .ref b{font-size:12px;color:var(--lavender)}
  .ref>span{font-weight:600;font-size:14px}
  .flags{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--green)}
  /* بيانات الفعالية والعميل — يعبّيها المشرف */
  .badge.miss{background:#FFF2D9;color:#9A5B00}
  .edit-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;cursor:pointer;
    border:1px dashed var(--lavender);background:#fff;color:var(--royal-purple);font:inherit;font-size:13px;font-weight:600;transition:.15s}
  .edit-btn:hover{background:var(--soft)}
  .edit-btn.need{border-style:solid;border-color:#F5C46B;background:#FFF8EA;color:#8A5300}
  .resp.editing{border-color:var(--lavender);box-shadow:0 0 0 3px rgba(147,95,199,.15)}
  .edit{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid #DCC8F2;animation:up .3s both}
  .edit .e-title{font-size:13px;color:var(--royal-purple)}
  .eg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .eg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .eg input,.eg select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:15px;color:var(--ink);outline:none}
  .eg input:focus,.eg select:focus{border-color:var(--lavender);box-shadow:0 0 0 3px rgba(147,95,199,.15)}
  .ea{display:flex;gap:8px}
  @media(max-width:560px){.eg{grid-template-columns:1fr}.eg input,.eg select{font-size:16px}}
  .empty{text-align:center;padding:50px 16px;color:var(--muted);grid-column:1/-1}

  .toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translate(-50%,120px);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:12px;font-size:14px;transition:transform .3s;z-index:50}
  .toast.show{transform:translate(-50%,0)}

  .print-head{display:none}

  @media(max-width:560px){
    .bar h1{font-size:16px}
    .actions{width:100%}
    .actions .btn{flex:1;padding:10px 8px}
    .actions .btn .t{display:none}
    .actions .btn.light .t,.actions .btn.pdf .t{display:inline}
    .kpi b{font-size:26px}
    .meter{grid-template-columns:84px 1fr 38px}
  }

  /* ===== الطباعة / PDF ===== */
  @media print{
    @page{size:A4;margin:12mm}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;animation:none!important}
    html,body{background:#fff}
    header.top,.filters,.toast,.no-print{display:none!important}
    main{margin:0;padding:0}
    .wrap{max-width:none;padding:0}
    .print-head{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--royal-purple);padding-bottom:10px;margin-bottom:14px}
    .print-head img{height:34px}
    .print-head h1{font-size:18px;color:var(--royal-purple)}
    .print-head p{font-size:11px;color:var(--muted)}
    .kpis{grid-template-columns:repeat(5,1fr)!important}
    .kpis .kpi:first-child{grid-column:auto!important}
    .kpi{padding:8px 10px}.kpi b{font-size:20px}
    .two{grid-template-columns:1fr 1fr!important}
    .panel,.kpi,.resp{break-inside:avoid;box-shadow:none}
    .list{grid-template-columns:1fr 1fr!important;gap:8px}
    .resp{padding:10px;gap:5px;font-size:12px}
    .q{font-size:12px;padding:5px 8px}
    .contact a.wa,.edit-btn,.edit{display:none!important}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="spark" viewBox="0 0 24 24"><path d="M12 1.5C12.9 7.6 16.4 11.1 22.5 12 16.4 12.9 12.9 16.4 12 22.5 11.1 16.4 7.6 12.9 1.5 12 7.6 11.1 11.1 7.6 12 1.5Z"/></symbol>
</defs></svg>

<!-- تسجيل الدخول -->
<section class="login" id="loginView">
  <form id="loginForm">
    <img src="assets/logo-color.svg" alt="Evnteck">
    <h1>لوحة التقييمات</h1>
    <p>أدخل كلمة المرور لعرض ردود العملاء</p>
    <input type="password" id="pw" placeholder="كلمة المرور" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn primary block" id="loginBtn" type="submit">دخول</button>
  </form>
</section>

<!-- اللوحة -->
<div id="appView" class="hide">
  <header class="top">
    <div class="wrap">
      <div class="bar">
        <img src="assets/logo-white.svg" alt="Evnteck">
        <h1>لوحة التقييمات<small id="updated"></small></h1>
        <div class="actions">
          <button class="btn" id="refreshBtn" type="button" title="تحديث"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 4v5h-5"/></svg><span class="t">تحديث</span></button>
          <button class="btn" id="csvBtn" type="button" title="Excel"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M9 13l6 6M15 13l-6 6"/></svg><span class="t">Excel</span></button>
          <button class="btn light pdf" id="pdfBtn" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="t">تصدير PDF</span></button>
          <button class="btn" id="logoutBtn" type="button" title="خروج"><svg viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l-5-5 5-5M5 12h11"/></svg><span class="t">خروج</span></button>
        </div>
      </div>
      <div class="demo hide" id="demoNote">وضع تجريبي: هذه بيانات وهمية للمعاينة فقط. ضع رابط SCRIPT_URL في admin.html لعرض ردودك الحقيقية.</div>
    </div>
  </header>

  <main class="wrap">
    <div class="print-head">
      <div><h1>تقرير تقييمات العملاء</h1><p id="printMeta"></p></div>
      <img src="assets/logo-color.svg" alt="Evnteck">
    </div>

    <div class="panel filters">
      <div class="search"><label for="q">بحث</label><input type="search" id="q" placeholder="اسم، شركة، رقم، ملاحظة..."></div>
      <div><label for="period">الفترة</label>
        <select id="period"><option value="all">كل الفترات</option><option value="7">آخر 7 أيام</option><option value="30">آخر 30 يوم</option>
          <option value="month">هذا الشهر</option><option value="custom">فترة مخصصة</option></select></div>
      <div><label for="rating">التقييم</label>
        <select id="rating"><option value="">الكل</option><option value="low">يحتاج متابعة (3 أو أقل)</option><option value="missing">ينقصها بيانات الفعالية/العميل</option><option value="ref">فيها ترشيح عميل جديد</option>
          <option value="5">5 نجوم</option><option value="4">4 نجوم</option><option value="3">3 نجوم</option><option value="2">نجمتان</option><option value="1">نجمة</option></select></div>
      <div><label for="sort">الترتيب</label>
        <select id="sort"><option value="new">الأحدث أولاً</option><option value="old">الأقدم أولاً</option><option value="hi">الأعلى تقييماً</option><option value="lo">الأقل تقييماً</option></select></div>
      <div class="custom hide" id="customRange">
        <div><label for="from">من</label><input type="date" id="from"></div>
        <div><label for="to">إلى</label><input type="date" id="to"></div>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>
    <div class="two">
      <div class="panel"><h2>توزيع التقييم العام</h2><div id="dist"></div></div>
      <div class="panel"><h2>متوسط جوانب الخدمة (من 5)</h2><div id="crit"></div></div>
    </div>

    <div class="list-h"><h2>الردود</h2><span id="count"></span></div>
    <div class="list" id="list"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* =================== الإعدادات =================== */
const CONFIG = {
  // نفس الرابط الموجود في index.html
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbw8eSYKG4h7MZYlu64zvXi7C1qZkDXJdGvWeiOSyZYVAadAQyfz8GmWnN3qPt07jVOfww/exec",
  AUTO_REFRESH_MIN: 2   // تحديث تلقائي كل كم دقيقة
};

const $=id=>document.getElementById(id);
const DEMO=!CONFIG.SCRIPT_URL.startsWith('http');
const CRIT=[['quality','جودة الشاشات'],['delivery','التوصيل والتركيب'],['support','الدعم الفني'],['staff','تعامل الفريق'],['value','القيمة مقابل السعر']];
const COLS=[['timestamp','التاريخ والوقت'],['overall','التقييم العام'],['nps','درجة التوصية'],...CRIT,['eventType','نوع الفعالية'],
  ['screenType','نوع الشاشة'],['eventDate','تاريخ الفعالية'],['feedback','ملاحظات العميل'],['name','الاسم'],
  ['company','الجهة'],['phone','الجوال'],['contactOk','يوافق على التواصل'],['publishOk','يوافق على النشر'],['referral','جهة/شخص مرشّح'],['referralPhone','رقم المرشّح'],['lang','اللغة'],['source','المصدر']];
let key='', data=[], timer=null, editing=null;   // editing = رقم الصف المفتوح للتعديل

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v===''||v==null?null:Number(v);
const fmt=(d,o)=>new Intl.DateTimeFormat('ar-OM-u-nu-latn',o).format(d);
const store={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}

/* =================== جلب البيانات =================== */
async function fetchRows(){
  if(DEMO) return demoRows();
  const r=await fetch(CONFIG.SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'list',key})});
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||'error');
  return (j.rows||[]).map(norm);
}
// الردود القديمة كان فيها حقلين (ما أعجبه / مقترحات التحسين) — ندمجهم في حقل الملاحظات
function norm(r){
  if(!r.feedback) r.feedback=[r.liked,r.improve].filter(Boolean).join('\n');
  return r;
}
async function load(quiet){
  const b=$('refreshBtn'); b.classList.add('spin'); b.disabled=true;
  try{
    const before=data.length;
    data=await fetchRows();
    $('updated').textContent='آخر تحديث '+fmt(new Date(),{hour:'numeric',minute:'2-digit'});
    if(editing===null) draw();
    if(quiet && data.length>before && before) toast('وصلك '+(data.length-before)+' تقييم جديد ✦');
    else if(!quiet) toast('تم التحديث');
  }catch(e){ if(e.message==='unauthorized') return logout(); if(!quiet) toast('تعذر التحديث، تحقق من الاتصال'); throw e }
  finally{ b.classList.remove('spin'); b.disabled=false }
}

/* =================== الدخول =================== */
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=$('loginBtn'), err=$('loginErr'); err.textContent=''; btn.disabled=true; btn.textContent='جارٍ التحقق...';
  key=$('pw').value;
  try{ data=await fetchRows(); store.set('evk',key); openApp() }
  catch(x){
    err.textContent = x.message==='unauthorized'?'كلمة المرور غير صحيحة'
      : x.message==='no_password'?'لم يتم ضبط ADMIN_PASSWORD في Apps Script'
      : 'تعذر الاتصال — تأكد من SCRIPT_URL وأنك نشرت نسخة جديدة من Apps Script';
    $('loginForm').animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:300});
  }
  btn.disabled=false; btn.textContent='دخول';
});
function openApp(){
  $('loginView').classList.add('hide'); $('appView').classList.remove('hide');
  $('demoNote').classList.toggle('hide',!DEMO);
  $('updated').textContent='آخر تحديث '+fmt(new Date(),{hour:'numeric',minute:'2-digit'});
  draw();
  clearInterval(timer); timer=setInterval(()=>load(true).catch(()=>{}),CONFIG.AUTO_REFRESH_MIN*60000);
}
function logout(){ store.set('evk',null); clearInterval(timer); key=''; data=[];
  $('appView').classList.add('hide'); $('loginView').classList.remove('hide'); $('pw').value=''; }
$('logoutBtn').onclick=logout;
$('refreshBtn').onclick=()=>load(false).catch(()=>{});

/* =================== الفلترة =================== */
function range(){
  const p=$('period').value, now=new Date(); let from=null,to=null;
  if(p==='7'||p==='30') from=new Date(now-Number(p)*864e5);
  else if(p==='month') from=new Date(now.getFullYear(),now.getMonth(),1);
  else if(p==='custom'){ if($('from').value) from=new Date($('from').value+'T00:00'); if($('to').value) to=new Date($('to').value+'T23:59:59'); }
  return {from,to};
}
function periodLabel(){
  const p=$('period'); if(p.value!=='custom') return p.options[p.selectedIndex].text;
  return 'من '+($('from').value||'البداية')+' إلى '+($('to').value||'اليوم');
}
function filtered(){
  const {from,to}=range(), q=$('q').value.trim().toLowerCase(), rt=$('rating').value, s=$('sort').value;
  return data.filter(r=>{
    const t=new Date(r.timestamp);
    if(from&&t<from) return false; if(to&&t>to) return false;
    const o=Number(r.overall);
    if(rt==='low'&&o>3) return false; if(rt==='ref'&&!r.referral&&!r.referralPhone) return false;
    if(rt==='missing'&&hasInfo(r)) return false;
    if(rt&&!['low','ref','missing'].includes(rt)&&o!==Number(rt)) return false;
    if(q&&![r.name,r.company,r.phone,r.feedback,r.referral,r.referralPhone,r.eventType,r.screenType,r.source].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=> s==='old'?new Date(a.timestamp)-new Date(b.timestamp)
    : s==='hi'?b.overall-a.overall||new Date(b.timestamp)-new Date(a.timestamp)
    : s==='lo'?a.overall-b.overall||new Date(b.timestamp)-new Date(a.timestamp)
    : new Date(b.timestamp)-new Date(a.timestamp));
}
['q','period','rating','sort','from','to'].forEach(id=>$(id).addEventListener('input',()=>{
  $('customRange').classList.toggle('hide',$('period').value!=='custom'); draw();
}));

/* =================== العرض =================== */
const stars=n=>Array.from({length:5},(_,i)=>`<svg class="${i<n?'on':''}"><use href="#spark"/></svg>`).join('');
const evDate=v=>{const d=new Date(String(v).slice(0,10)+'T00:00'); return isNaN(d)?v:fmt(d,{day:'numeric',month:'short',year:'numeric'})};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
/* بيانات الفعالية والعميل (القسمين 4 و 6) — المشرف يعبّيها هنا بدل العميل */
const INFO=['eventType','screenType','eventDate','name','company','phone'];
const EV_LIST=['مؤتمر','معرض','حفل / مناسبة','فعالية شركة','تعليم / تدريب','أخرى'];
const SC_LIST=['شاشة لمس تفاعلية','شاشة LED','كشك تفاعلي (Kiosk)','سبورة ذكية','جدار شاشات (Video Wall)','عرض هولوجرافي','أخرى'];
const hasInfo=r=>INFO.some(k=>r[k]!==''&&r[k]!=null);
const opts=(list,v)=>'<option value="">— اختر —</option>'+list.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')
  +(v&&!list.includes(v)?`<option selected>${esc(v)}</option>`:'');
function editor(r){
  const today=new Date().toISOString().slice(0,10);
  return `<form class="edit" data-row="${r._row}">
    <b class="e-title">بيانات الفعالية والعميل</b>
    <div class="eg">
      <label>نوع الفعالية<select name="eventType">${opts(EV_LIST,r.eventType)}</select></label>
      <label>نوع الشاشة<select name="screenType">${opts(SC_LIST,r.screenType)}</select></label>
      <label>تاريخ الفعالية<input type="date" name="eventDate" max="${today}" value="${esc(String(r.eventDate||'').slice(0,10))}"></label>
      <label>اسم العميل<input name="name" autocomplete="off" value="${esc(r.name)}"></label>
      <label>الجهة / الشركة<input name="company" autocomplete="off" value="${esc(r.company)}"></label>
      <label>رقم الجوال<input name="phone" type="tel" dir="ltr" autocomplete="off" placeholder="+968 9XXX XXXX" value="${esc(r.phone)}"></label>
    </div>
    <div class="ea"><button class="btn primary" type="submit">حفظ</button><button class="btn" type="button" data-act="cancel">إلغاء</button></div>
  </form>`;
}
function waLink(p){let d=String(p).replace(/\D/g,''); if(d.startsWith('00'))d=d.slice(2); if(d.length===8)d='968'+d; return d.length>=8?'https://wa.me/'+d:''}

function draw(){
  const rows=filtered(), n=rows.length;
  const ov=rows.map(r=>num(r.overall)).filter(v=>v), np=rows.map(r=>num(r.nps)).filter(v=>v!==null);
  const nps=np.length?Math.round((np.filter(v=>v>=9).length-np.filter(v=>v<=6).length)/np.length*100):null;
  const a=avg(ov), low=ov.filter(v=>v<=3).length, sat=ov.length?Math.round(ov.filter(v=>v>=4).length/ov.length*100):null;
  $('kpis').innerHTML=[
    ['عدد التقييمات',n,'' ,''],
    ['متوسط التقييم',a?a.toFixed(1):'—','من 5',''],
    ['مؤشر التوصية NPS',nps===null?'—':(nps>0?'+':'')+nps,'من -100 إلى +100',''],
    ['نسبة الرضا',sat===null?'—':sat+'%','4 و 5 نجوم',''],
    ['يحتاج متابعة',low,'3 نجوم أو أقل',low?'warn':'']
  ].map(([l,v,s,c],i)=>`<div class="kpi ${c}" style="animation-delay:${i*.05}s"><span>${l}</span><b>${v}</b><small>${s}</small></div>`).join('');

  $('dist').innerHTML=[5,4,3,2,1].map(s=>{const c=ov.filter(v=>v===s).length, p=ov.length?c/ov.length*100:0;
    return `<div class="meter ${s<=2?'low':''}"><span>${s} ${s===1?'نجمة':s===2?'نجمتان':'نجوم'}</span><div class="tr"><i style="width:${p}%"></i></div><em>${c}</em></div>`}).join('');
  $('crit').innerHTML=CRIT.map(([k,l])=>{const v=avg(rows.map(r=>num(r[k])).filter(x=>x));
    return `<div class="meter ${v&&v<3.5?'low':''}"><span>${l}</span><div class="tr"><i style="width:${v?v/5*100:0}%"></i></div><em>${v?v.toFixed(1):'—'}</em></div>`}).join('');

  const miss=data.filter(r=>!hasInfo(r)).length;
  $('count').textContent=n+(n===data.length?'':' من '+data.length)+(miss?` · ${miss} ينقصها بيانات`:'');
  $('list').innerHTML=n?rows.map((r,i)=>{
    const o=Number(r.overall), nv=num(r.nps), t=new Date(r.timestamp), wa=r.phone?waLink(r.phone):'';
    const cr=CRIT.filter(([k])=>r[k]!==''&&r[k]!=null).map(([k,l])=>`<span>${l}: <b>${esc(r[k])}</b></span>`).join('');
    const info=hasInfo(r), ed=editing===r._row;
    return `<article class="resp ${o<=3?'low':o===5?'top':''}${ed?' editing':''}" style="animation-delay:${Math.min(i,12)*.03}s">
      <div class="r-top"><div class="stars">${stars(o)}</div>
        ${nv===null?'':`<span class="badge ${nv>=9?'p':nv<=6?'d':''}">توصية ${nv}/10</span>`}
        ${o<=3?'<span class="badge alert">يحتاج متابعة</span>':''}
        ${info?'':'<span class="badge miss">ينقصها بيانات</span>'}
        <time>${isNaN(t)?'':fmt(t,{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'})}</time></div>
      <div class="who"><b>${esc(r.name)||'بدون اسم'}</b>${r.company?` <span>· ${esc(r.company)}</span>`:''}</div>
      ${r.phone?`<div class="contact"><a href="tel:${esc(String(r.phone).replace(/[^\d+]/g,''))}">اتصال <span class="ph">${esc(r.phone)}</span></a>${wa?`<a class="wa" href="${wa}" target="_blank" rel="noopener">واتساب</a>`:''}</div>`:''}
      ${(r.eventType||r.screenType||r.eventDate||r.source)?`<div class="tags">${r.eventType?`<span>${esc(r.eventType)}</span>`:''}${r.screenType?`<span>${esc(r.screenType)}</span>`:''}${r.eventDate?`<span>فعالية ${esc(evDate(r.eventDate))}</span>`:''}${r.source?`<span>المصدر: ${esc(r.source)}</span>`:''}</div>`:''}
      ${cr?`<div class="crit">${cr}</div>`:''}
      ${r.feedback?`<p class="q ${o<=3?'bad':''}"><b>ملاحظات العميل</b>${esc(r.feedback)}</p>`:''}
      ${(r.referral||r.referralPhone)?`<div class="ref"><b>✦ ترشيح عميل جديد</b><span>${esc(r.referral)||'بدون اسم'}</span>
        ${r.referralPhone?`<div class="contact"><a href="tel:${esc(String(r.referralPhone).replace(/[^\d+]/g,''))}">اتصال <span class="ph">${esc(r.referralPhone)}</span></a>${waLink(r.referralPhone)?`<a class="wa" href="${waLink(r.referralPhone)}" target="_blank" rel="noopener">واتساب</a>`:''}</div>`:''}</div>`:''}
      ${(r.contactOk==='نعم'||r.publishOk==='نعم')?`<div class="flags">${r.contactOk==='نعم'?'<span>✓ يوافق على التواصل</span>':''}${r.publishOk==='نعم'?'<span>✓ يوافق على النشر</span>':''}</div>`:''}
      ${ed ? editor(r) : `<button type="button" class="edit-btn${info?'':' need'}" data-act="edit" data-row="${r._row}">${info?'✎ تعديل بيانات الفعالية والعميل':'＋ إضافة بيانات الفعالية والعميل'}</button>`}
    </article>`}).join('')
    : `<div class="empty">${data.length?'لا توجد نتائج مطابقة للفلاتر':'لا توجد تقييمات بعد'}</div>`;
}

/* =================== تعديل بيانات الفعالية والعميل =================== */
$('list').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act==='edit'){
    editing=Number(b.dataset.row); draw();
    const f=document.querySelector(`form.edit[data-row="${editing}"]`); if(f) f.querySelector('select').focus();
  }
  if(b.dataset.act==='cancel'){ editing=null; draw() }
});
$('list').addEventListener('submit',async e=>{
  const f=e.target.closest('form.edit'); if(!f) return; e.preventDefault();
  const r=data.find(x=>x._row===Number(f.dataset.row)); if(!r) return;
  const fields={}; INFO.forEach(k=>fields[k]=f.elements[k].value.trim());
  const btn=f.querySelector('[type=submit]'); btn.disabled=true; btn.textContent='جارٍ الحفظ...';
  try{
    if(!DEMO){
      const res=await fetch(CONFIG.SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'update',key,row:r._row,timestamp:r.timestamp,fields})});
      const j=await res.json(); if(!j.ok) throw new Error(j.error||'error');
    }
    Object.assign(r,fields); editing=null; draw(); toast('تم حفظ البيانات ✓');
  }catch(x){
    btn.disabled=false; btn.textContent='حفظ';
    if(x.message==='unauthorized') return logout();
    toast(x.message==='row_changed'?'الصف تغيّر في الشيت — اضغط «تحديث» وحاول مرة ثانية':'تعذر الحفظ، تحقق من الاتصال');
  }
});

/* =================== التصدير =================== */
$('pdfBtn').onclick=()=>{
  $('printMeta').textContent='الفترة: '+periodLabel()+' · عدد التقييمات: '+filtered().length+' · تاريخ التقرير: '
    +fmt(new Date(),{day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit'});
  toast('اختر "حفظ كـ PDF" من نافذة الطباعة');
  setTimeout(()=>window.print(),300);
};
$('csvBtn').onclick=()=>{
  const rows=filtered(), q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='﻿'+[COLS.map(c=>q(c[1])).join(','),...rows.map(r=>COLS.map(([k])=>q(r[k])).join(','))].join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='evnteck-feedback-'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

/* =================== بيانات تجريبية =================== */
function demoRows(){
  const names=['أحمد البلوشي','سارة الحارثي','محمد الكندي','مريم الهنائي','خالد الرواحي','نورة العامري','سالم المعمري','ريم الشكيلي','','يوسف الفارسي'];
  const comps=['شركة الأفق للمعارض','جامعة السلطان قابوس','','وزارة الثقافة','مجموعة الندى','','فندق الموج'];
  const ev=['مؤتمر','معرض','حفل / مناسبة','فعالية شركة','تعليم / تدريب'], sc=['شاشة لمس تفاعلية','شاشة LED','كشك تفاعلي (Kiosk)','جدار شاشات (Video Wall)','عرض هولوجرافي'];
  const fbk=['سرعة التركيب ووضوح الشاشة كانت ممتازة','الفريق متعاون جداً، ونتمنى خيارات محتوى أكثر','الشاشة جذبت الزوار بشكل كبير',''], bad=['الشاشة ممتازة لكن التأخر في الوصول نصف ساعة أثّر علينا','نتمنى دعم فني أسرع أثناء الفعالية'];
  const refs=[['مجموعة الريادة للفعاليات','+968 9234 5678'],['كلية عُمان للإدارة',''],['فندق البستان','+968 9876 1234']];
  let s=7; const R=()=>(s=(s*9301+49297)%233280)/233280;
  return Array.from({length:24},(_,i)=>{const o=[5,5,4,5,4,3,5,2,4,5][i%10], d=new Date(Date.now()-R()*55*864e5), ed=new Date(d-R()*3*864e5);
    const ph=R()>.35?'+968 9'+String(Math.floor(R()*1e7)).padStart(7,'0'):'';
    const blank=i%3===0;   // بعض الردود الجديدة بدون بيانات (المشرف يعبّيها)
    return {_row:i+2,timestamp:d.toISOString(),overall:o,nps:Math.min(10,Math.max(0,o*2-Math.floor(R()*3))),
      quality:R()>.3?Math.min(5,o+Math.round(R())):'',delivery:R()>.3?Math.max(1,o-Math.round(R())):'',support:R()>.4?o:'',staff:R()>.3?5:'',value:R()>.4?Math.max(1,o-1):'',
      eventType:blank?'':ev[i%5],screenType:blank?'':sc[(i*3)%5],eventDate:blank?'':ed.toISOString().slice(0,10),feedback:o<=3?bad[i%2]:fbk[i%4],referral:i%5===1?refs[i%3][0]:'',referralPhone:i%5===1?refs[i%3][1]:'',
      name:blank?'':names[i%10],company:blank?'':comps[i%7],phone:blank?'':ph,contactOk:ph?'نعم':'لا',publishOk:o>=4&&R()>.5?'نعم':'لا',lang:'ar',source:['whatsapp','qr',''][i%3]}});
}

/* =================== البدء =================== */
(async()=>{ const k=store.get('evk'); if(!k) return; key=k;
  try{ data=await fetchRows(); openApp() }catch(e){ store.set('evk',null) } })();
</script>
